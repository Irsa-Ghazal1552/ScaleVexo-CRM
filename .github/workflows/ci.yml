name: CI

on:
  pull_request:
  push:
    branches: [main, "release*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff, ESLint, TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.13,<0.14"
      - run: ruff check apps/api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web

  backend:
    name: Backend tests (pytest on PostgreSQL 17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scalevexo
          POSTGRES_USER: scalevexo
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scalevexo" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-password
      DJANGO_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/api
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
        working-directory: apps/api
      - run: pytest
        working-directory: apps/api

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web

  e2e:
    name: End-to-end (Playwright + axe on the Docker stack)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      E2E_BASE_URL: http://localhost
      E2E_OWNER_EMAIL: ceo@scalevexo.com
      E2E_OWNER_PASSWORD: Ci-Owner-Pass-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Configure the stack like a first-time install (README section 1)
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^OWNER_PASSWORD=.*|OWNER_PASSWORD=${E2E_OWNER_PASSWORD}|" \
            -e "s|^SEED_DEMO=.*|SEED_DEMO=true|" \
            -e "s|^REQUIRE_MFA_FOR_PRIVILEGED=.*|REQUIRE_MFA_FOR_PRIVILEGED=false|" \
            .env
      - name: Start api, worker, web and PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Stack is healthy
        run: |
          curl -fsS http://localhost/api/health
          docker compose ps
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test
        working-directory: e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
